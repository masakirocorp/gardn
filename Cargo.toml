[workspace]
members = ["apps/gardn", "apps/gardn/vendor/portable-pty", "crates/gardn-local-api"]
default-members = ["apps/gardn"]
resolver = "2"

[workspace.metadata]
name = "gardn-rust"

[patch.crates-io]
portable-pty = { path = "apps/gardn/vendor/portable-pty" }

# Keep routine builds fast; use `cargo build --profile debugging` for full LLDB symbols.
[profile.dev]
debug = 0

[profile.debugging]
inherits = "dev"
debug = 2
