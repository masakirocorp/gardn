name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  flake-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            always-allow-substitutes = true

      - name: Run Nix flake check
        run: |
          nix flake check --print-build-logs
          nix flake check --all-systems --no-build --print-build-logs

  build:
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            name: omh-linux-x86_64
            libghostty_vt_optimize: ReleaseFast
            libghostty_vt_simd: 'true'
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            name: omh-linux-aarch64
            libghostty_vt_optimize: ReleaseFast
            libghostty_vt_simd: 'true'
          - target: x86_64-apple-darwin
            os: macos-26
            name: omh-macos-x86_64
            libghostty_vt_optimize: ReleaseFast
            libghostty_vt_simd: 'true'
          - target: aarch64-apple-darwin
            os: macos-26
            name: omh-macos-aarch64
            libghostty_vt_optimize: ReleaseFast
            libghostty_vt_simd: 'true'
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            name: omh-windows-x86_64.exe
            libghostty_vt_optimize: ReleaseFast
            libghostty_vt_simd: 'true'

    runs-on: ${{ matrix.os }}
    env:
      LIBGHOSTTY_VT_OPTIMIZE: ${{ matrix.libghostty_vt_optimize }}
      LIBGHOSTTY_VT_SIMD: ${{ matrix.libghostty_vt_simd }}
      OMH_BUILD_CHANNEL: release
      OMH_BUILD_COHORT: ${{ github.sha }}
      OMH_RELEASE_TAG: ${{ github.ref_name }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Enable pnpm
        run: corepack enable

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tag matches Cargo.toml version
        shell: bash
        run: |
          CARGO_VERSION=$(grep '^version' apps/omh/Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$CARGO_VERSION" != "$TAG_VERSION" ]; then
            echo "error: tag $GITHUB_REF_NAME doesn't match Cargo.toml version $CARGO_VERSION"
            exit 1
          fi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Select Xcode for Zig
        if: runner.os == 'macOS'
        run: |
          # Zig 0.15.2 cannot link against Xcode 26.4+ macOS SDK TBDs
          # because their libSystem entries are arm64e-only.
          echo "DEVELOPER_DIR=/Applications/Xcode_26.3.app/Contents/Developer" >> "$GITHUB_ENV"

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2

      - name: Prefer official Ubuntu mirrors over Azure
        shell: bash
        if: runner.os == 'Linux'
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i '/azure.archive.ubuntu.com/d' /etc/apt/apt-mirrors.txt
            echo "Using apt mirrors:"
            cat /etc/apt/apt-mirrors.txt
          fi

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build musl-tools gcc-aarch64-linux-gnu crossbuild-essential-arm64

      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: brew install cmake ninja

      - name: Set Linux aarch64 musl toolchain
        if: matrix.target == 'aarch64-unknown-linux-musl'
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/aarch64-linux-musl-zigcc" <<'EOF'
          #!/usr/bin/env bash
          args=()
          for arg in "$@"; do
            case "$arg" in
              --target=aarch64-unknown-linux-musl) args+=("--target=aarch64-linux-musl") ;;
              *) args+=("$arg") ;;
            esac
          done
          exec zig cc -target aarch64-linux-musl "${args[@]}"
          EOF
          chmod +x "$RUNNER_TEMP/aarch64-linux-musl-zigcc"
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=rust-lld" >> "$GITHUB_ENV"
          echo "CC_aarch64_unknown_linux_musl=$RUNNER_TEMP/aarch64-linux-musl-zigcc" >> "$GITHUB_ENV"

      - name: Cache Rust artifacts
        if: runner.os != 'Windows'
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Remove Zig caches
        shell: bash
        run: rm -rf .zig-cache apps/omh/vendor/libghostty-vt/.zig-cache apps/omh/vendor/libghostty-vt/zig-out

      - name: Build through Turbo
        shell: bash
        run: pnpm turbo run build --filter=omh -- --release --target ${{ matrix.target }}

      - name: Run Windows smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/smoke_windows_ci.ps1 target/${{ matrix.target }}/release/omh.exe

      - name: Rename binary
        shell: bash
        run: |
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            cp target/${{ matrix.target }}/release/omh.exe "${{ matrix.name }}"
          else
            cp target/${{ matrix.target }}/release/omh "${{ matrix.name }}"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}

  release:
    needs: [build, flake-check]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@v8

      - name: Prepare release notes
        run: python3 scripts/extract_release_notes.py apps/omh/CHANGELOG.md omh "${GITHUB_REF_NAME#v}" > RELEASE_NOTES.md

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            omh-linux-x86_64/omh-linux-x86_64
            omh-linux-aarch64/omh-linux-aarch64
            omh-macos-x86_64/omh-macos-x86_64
            omh-macos-aarch64/omh-macos-aarch64
            omh-windows-x86_64.exe/omh-windows-x86_64.exe
          body_path: RELEASE_NOTES.md

