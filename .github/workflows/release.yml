name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  flake-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            always-allow-substitutes = true

      - name: Run Nix flake check
        run: |
          nix flake check --print-build-logs
          nix flake check --all-systems --no-build --print-build-logs

  build:
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            name: gardn-linux-x86_64
            libghostty_vt_optimize: ReleaseFast
            libghostty_vt_simd: 'true'
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            name: gardn-linux-aarch64
            libghostty_vt_optimize: ReleaseFast
            libghostty_vt_simd: 'true'
          - target: x86_64-apple-darwin
            os: macos-26
            name: gardn-macos-x86_64
            libghostty_vt_optimize: ReleaseFast
            libghostty_vt_simd: 'true'
          - target: aarch64-apple-darwin
            os: macos-26
            name: gardn-macos-aarch64
            libghostty_vt_optimize: ReleaseFast
            libghostty_vt_simd: 'true'
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            name: gardn-windows-x86_64.exe
            libghostty_vt_optimize: ReleaseFast
            libghostty_vt_simd: 'true'

    runs-on: ${{ matrix.os }}
    env:
      LIBGHOSTTY_VT_OPTIMIZE: ${{ matrix.libghostty_vt_optimize }}
      LIBGHOSTTY_VT_SIMD: ${{ matrix.libghostty_vt_simd }}
      GARDN_BUILD_CHANNEL: release
      GARDN_BUILD_COHORT: ${{ github.sha }}
      GARDN_RELEASE_TAG: ${{ github.ref_name }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable pnpm
        run: corepack enable

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tag matches Cargo.toml version
        shell: bash
        run: |
          CARGO_VERSION=$(grep '^version' apps/gardn/Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$CARGO_VERSION" != "$TAG_VERSION" ]; then
            echo "error: tag $GITHUB_REF_NAME doesn't match Cargo.toml version $CARGO_VERSION"
            exit 1
          fi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Select Xcode for Zig
        if: runner.os == 'macOS'
        run: |
          # Keep Zig aligned with the vendored libghostty-vt minimum version.
          echo "DEVELOPER_DIR=/Applications/Xcode_26.3.app/Contents/Developer" >> "$GITHUB_ENV"

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      - name: Prefer official Ubuntu mirrors over Azure
        shell: bash
        if: runner.os == 'Linux'
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i '/azure.archive.ubuntu.com/d' /etc/apt/apt-mirrors.txt
            echo "Using apt mirrors:"
            cat /etc/apt/apt-mirrors.txt
          fi

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build musl-tools gcc-aarch64-linux-gnu crossbuild-essential-arm64

      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: brew install cmake ninja

      - name: Set Linux aarch64 musl toolchain
        if: matrix.target == 'aarch64-unknown-linux-musl'
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/aarch64-linux-musl-zigcc" <<'EOF'
          #!/usr/bin/env bash
          args=()
          for arg in "$@"; do
            case "$arg" in
              --target=aarch64-unknown-linux-musl) args+=("--target=aarch64-linux-musl") ;;
              *) args+=("$arg") ;;
            esac
          done
          exec zig cc -target aarch64-linux-musl "${args[@]}"
          EOF
          chmod +x "$RUNNER_TEMP/aarch64-linux-musl-zigcc"
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=rust-lld" >> "$GITHUB_ENV"
          echo "CC_aarch64_unknown_linux_musl=$RUNNER_TEMP/aarch64-linux-musl-zigcc" >> "$GITHUB_ENV"

      - name: Cache Rust artifacts
        if: runner.os != 'Windows'
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Remove Zig caches
        shell: bash
        run: rm -rf .zig-cache apps/gardn/vendor/libghostty-vt/.zig-cache apps/gardn/vendor/libghostty-vt/zig-out

      - name: Build through Turbo
        shell: bash
        run: pnpm turbo run build --filter=gardn -- --release --target ${{ matrix.target }}

      - name: Run Windows smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/smoke_windows_ci.ps1 target/${{ matrix.target }}/release/gardn.exe

      - name: Rename binary
        shell: bash
        run: |
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            cp target/${{ matrix.target }}/release/gardn.exe "${{ matrix.name }}"
          else
            cp target/${{ matrix.target }}/release/gardn "${{ matrix.name }}"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}

  macos-app:
    needs: build
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Select Xcode
        run: |
          echo "DEVELOPER_DIR=/Applications/Xcode_26.3.app/Contents/Developer" >> "$GITHUB_ENV"

      - name: Install packaging tools
        run: brew install fileicon create-dmg

      - name: Download macOS aarch64 binary
        uses: actions/download-artifact@v8
        with:
          name: gardn-macos-aarch64
          path: gardn-macos-aarch64

      - name: Import signing certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          echo -n "$CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          security import $CERTIFICATE_PATH -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

      - name: Setup notarization credentials
        env:
          NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARYTOOL_KEY_P8_BASE64 }}
        run: |
          NOTARY_KEY_PATH=$RUNNER_TEMP/notary-key.p8
          echo -n "$NOTARY_KEY_BASE64" | base64 --decode -o $NOTARY_KEY_PATH
          echo "NOTARY_KEY_PATH=$NOTARY_KEY_PATH" >> $GITHUB_ENV

      - name: Build signed app
        env:
          SIGN_IDENTITY: "Developer ID Application"
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NOTARIZE: "true"
          APPLE_NOTARYTOOL_KEY_ID: ${{ secrets.APPLE_NOTARYTOOL_KEY_ID }}
          APPLE_NOTARYTOOL_ISSUER_ID: ${{ secrets.APPLE_NOTARYTOOL_ISSUER_ID }}
          GARDN_BUNDLE_BIN: ${{ github.workspace }}/gardn-macos-aarch64/gardn-macos-aarch64
        run: ./scripts/build-macos-app.sh
      - name: Download Sparkle tools
        run: |
          curl -sLO https://github.com/sparkle-project/Sparkle/releases/download/2.8.1/Sparkle-2.8.1.tar.xz
          tar xf Sparkle-2.8.1.tar.xz -C $RUNNER_TEMP

      - name: Sign update and write appcast
        env:
          SPARKLE_KEY: ${{ secrets.SPARKLE_ED25519_PRIVATE_KEY }}
        run: |
          VERSION=$(grep '^version' apps/gardn/Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          TAG="${GITHUB_REF#refs/tags/}"
          ZIP_PATH="build/Gardn-$VERSION.zip"
          ZIP_SIZE=$(stat -f%z "$ZIP_PATH")
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/$TAG/Gardn-$VERSION.zip"
          KEY_FILE=$RUNNER_TEMP/sparkle_key
          echo "$SPARKLE_KEY" > "$KEY_FILE"
          SIGN_OUTPUT=$($RUNNER_TEMP/bin/sign_update "$ZIP_PATH" --ed-key-file "$KEY_FILE" 2>&1)
          rm -f "$KEY_FILE"
          SIGNATURE=$(echo "$SIGN_OUTPUT" | grep -o 'sparkle:edSignature="[^"]*"' | cut -d'"' -f2)
          if [ -z "$SIGNATURE" ]; then
            echo "error: Sparkle signature missing"
            echo "$SIGN_OUTPUT"
            exit 1
          fi
          cat > build/appcast.xml << EOF
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
            <channel>
              <title>Gardn Updates</title>
              <item>
                <title>Version $VERSION</title>
                <sparkle:version>$VERSION</sparkle:version>
                <sparkle:shortVersionString>$VERSION</sparkle:shortVersionString>
                <pubDate>$(date -R)</pubDate>
                <enclosure
                  url="$DOWNLOAD_URL"
                  length="$ZIP_SIZE"
                  type="application/octet-stream"
                  sparkle:edSignature="$SIGNATURE" />
              </item>
            </channel>
          </rss>
          EOF

      - name: Upload macOS app
        uses: actions/upload-artifact@v7
        with:
          name: macos-app
          path: |
            build/*.dmg
            build/*.zip
            build/appcast.xml

  release:
    needs: [build, flake-check, macos-app]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@v8

      - name: Prepare release notes
        run: python3 scripts/extract_release_notes.py apps/gardn/CHANGELOG.md gardn "${GITHUB_REF_NAME#v}" > RELEASE_NOTES.md

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          prerelease: ${{ contains(github.ref_name, '-beta.') }}
          files: |
            gardn-linux-x86_64/gardn-linux-x86_64
            gardn-linux-aarch64/gardn-linux-aarch64
            gardn-macos-x86_64/gardn-macos-x86_64
            gardn-macos-aarch64/gardn-macos-aarch64
            gardn-windows-x86_64.exe/gardn-windows-x86_64.exe
            macos-app/*.dmg
            macos-app/*.zip
            macos-app/appcast.xml
          body_path: RELEASE_NOTES.md
