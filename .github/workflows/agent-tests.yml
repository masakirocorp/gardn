name: Agent Fixture Tests

on:
  pull_request:
    paths:
      - .github/workflows/agent-tests.yml
      - .github/workflows/live-agent-tests.yml
      - ci/agent-tests/**
      - apps/gardn/src/manifests/maki.toml
      - apps/gardn/src/integration/assets/**
      - apps/gardn/src/integration/mod.rs
  push:
    branches: [master]
    paths:
      - .github/workflows/agent-tests.yml
      - .github/workflows/live-agent-tests.yml
      - ci/agent-tests/**
      - apps/gardn/src/manifests/maki.toml
      - apps/gardn/src/integration/assets/**
      - apps/gardn/src/integration/mod.rs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-fixture-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: image and fixture checks
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Resolve current agent CLI cohort
        id: cohort
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_REVISION: ${{ github.sha }}
          BUILD_RUN_ID: ${{ github.run_id }}
          BUILD_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          cohort_path="$RUNNER_TEMP/cohort.json"
          node ci/agent-tests/resolve-versions.mjs > "$cohort_path"
          cp "$cohort_path" ci/agent-tests/cohort.json
          {
            echo "CLAUDE_CODE_VERSION=$(jq -r '.build_args.CLAUDE_CODE_VERSION' "$cohort_path")"
            echo "CODEX_VERSION=$(jq -r '.build_args.CODEX_VERSION' "$cohort_path")"
            echo "OPENCODE_VERSION=$(jq -r '.build_args.OPENCODE_VERSION' "$cohort_path")"
            echo "COPILOT_VERSION=$(jq -r '.build_args.COPILOT_VERSION' "$cohort_path")"
            echo "HERMES_VERSION=$(jq -r '.build_args.HERMES_VERSION' "$cohort_path")"
            echo "DROID_VERSION=$(jq -r '.build_args.DROID_VERSION' "$cohort_path")"
            echo "PI_VERSION=$(jq -r '.build_args.PI_VERSION' "$cohort_path")"
            echo "QWEN_CODE_VERSION=$(jq -r '.build_args.QWEN_CODE_VERSION' "$cohort_path")"
            echo "KILO_VERSION=$(jq -r '.build_args.KILO_VERSION' "$cohort_path")"
            echo "MASTRACODE_VERSION=$(jq -r '.build_args.MASTRACODE_VERSION' "$cohort_path")"
            echo "KIMI_VERSION=$(jq -r '.build_args.KIMI_VERSION' "$cohort_path")"
            echo "MAKI_VERSION=$(jq -r '.build_args.MAKI_VERSION' "$cohort_path")"
            echo "OMP_REF=$(jq -r '.build_args.OMP_REF' "$cohort_path")"
            echo "ANTIGRAVITY_VERSION=$(jq -r '.build_args.ANTIGRAVITY_VERSION' "$cohort_path")"
            echo "ANTIGRAVITY_DOWNLOAD_URL=$(jq -r '.build_args.ANTIGRAVITY_DOWNLOAD_URL' "$cohort_path")"
            echo "ANTIGRAVITY_SHA512=$(jq -r '.build_args.ANTIGRAVITY_SHA512' "$cohort_path")"
          } >> "$GITHUB_OUTPUT"

      - name: Build image
        env:
          CLAUDE_CODE_VERSION: ${{ steps.cohort.outputs.CLAUDE_CODE_VERSION }}
          CODEX_VERSION: ${{ steps.cohort.outputs.CODEX_VERSION }}
          OPENCODE_VERSION: ${{ steps.cohort.outputs.OPENCODE_VERSION }}
          COPILOT_VERSION: ${{ steps.cohort.outputs.COPILOT_VERSION }}
          HERMES_VERSION: ${{ steps.cohort.outputs.HERMES_VERSION }}
          DROID_VERSION: ${{ steps.cohort.outputs.DROID_VERSION }}
          PI_VERSION: ${{ steps.cohort.outputs.PI_VERSION }}
          QWEN_CODE_VERSION: ${{ steps.cohort.outputs.QWEN_CODE_VERSION }}
          KILO_VERSION: ${{ steps.cohort.outputs.KILO_VERSION }}
          MASTRACODE_VERSION: ${{ steps.cohort.outputs.MASTRACODE_VERSION }}
          KIMI_VERSION: ${{ steps.cohort.outputs.KIMI_VERSION }}
          MAKI_VERSION: ${{ steps.cohort.outputs.MAKI_VERSION }}
          OMP_REF: ${{ steps.cohort.outputs.OMP_REF }}
          ANTIGRAVITY_VERSION: ${{ steps.cohort.outputs.ANTIGRAVITY_VERSION }}
          ANTIGRAVITY_DOWNLOAD_URL: ${{ steps.cohort.outputs.ANTIGRAVITY_DOWNLOAD_URL }}
          ANTIGRAVITY_SHA512: ${{ steps.cohort.outputs.ANTIGRAVITY_SHA512 }}
        run: |
          set -euo pipefail
          docker build \
            --platform linux/amd64 \
            --build-arg "CLAUDE_CODE_VERSION=${CLAUDE_CODE_VERSION}" \
            --build-arg "CODEX_VERSION=${CODEX_VERSION}" \
            --build-arg "OPENCODE_VERSION=${OPENCODE_VERSION}" \
            --build-arg "COPILOT_VERSION=${COPILOT_VERSION}" \
            --build-arg "HERMES_VERSION=${HERMES_VERSION}" \
            --build-arg "DROID_VERSION=${DROID_VERSION}" \
            --build-arg "PI_VERSION=${PI_VERSION}" \
            --build-arg "QWEN_CODE_VERSION=${QWEN_CODE_VERSION}" \
            --build-arg "KILO_VERSION=${KILO_VERSION}" \
            --build-arg "MASTRACODE_VERSION=${MASTRACODE_VERSION}" \
            --build-arg "KIMI_VERSION=${KIMI_VERSION}" \
            --build-arg "MAKI_VERSION=${MAKI_VERSION}" \
            --build-arg "OMP_REF=${OMP_REF}" \
            --build-arg "ANTIGRAVITY_VERSION=${ANTIGRAVITY_VERSION}" \
            --build-arg "ANTIGRAVITY_DOWNLOAD_URL=${ANTIGRAVITY_DOWNLOAD_URL}" \
            --build-arg "ANTIGRAVITY_SHA512=${ANTIGRAVITY_SHA512}" \
            -t gardn-agent-tests:ci \
            ci/agent-tests

      - name: Check installed CLIs
        run: docker run --rm gardn-agent-tests:ci

      - name: Check deterministic provider behavior
        run: node --test ci/agent-tests/deterministic-provider.test.mjs

      - name: Check deterministic provider-backed CLIs
        run: |
          set -euo pipefail
          for target in qwen-deterministic kilo-deterministic mastracode antigravity; do
            docker run --rm -v "${{ github.workspace }}:/repo:ro" gardn-agent-tests:ci \
              gardn-agent-tests-target "$target"
          done

      - name: Check provider env wiring
        run: >-
          docker run --rm
          -e OPENROUTER_API_KEY=sk-gardn-agent-test
          gardn-agent-tests:ci
          gardn-agent-tests-env gardn-agent-tests-verify-env

      - name: Check plugin fixtures
        run: |
          node --experimental-strip-types ci/agent-tests/pi-omp-plugin-status-test.mjs apps/gardn/src/integration/assets/pi/gardn-agent-state.ts pi
          node --experimental-strip-types ci/agent-tests/pi-omp-plugin-status-test.mjs apps/gardn/src/integration/assets/omp/gardn-agent-state.ts omp
          node ci/agent-tests/qoder-openrouter-proxy-test.mjs
