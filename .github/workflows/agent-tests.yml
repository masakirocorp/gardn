name: Agent Fixture Tests

on:
  pull_request:
    paths:
      - .github/workflows/agent-tests.yml
      - .github/workflows/live-agent-tests.yml
      - ci/agent-tests/**
      - apps/omh/src/manifests/maki.toml
      - apps/omh/src/integration/assets/**
      - apps/omh/src/integration/mod.rs
  push:
    branches: [master]
    paths:
      - .github/workflows/agent-tests.yml
      - .github/workflows/live-agent-tests.yml
      - ci/agent-tests/**
      - apps/omh/src/manifests/maki.toml
      - apps/omh/src/integration/assets/**
      - apps/omh/src/integration/mod.rs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-fixture-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: image and fixture checks
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build image
        run: docker build -t omh-agent-tests:ci ci/agent-tests

      - name: Check installed CLIs
        run: docker run --rm omh-agent-tests:ci

      - name: Check provider env wiring
        run: >-
          docker run --rm
          -e OPENROUTER_API_KEY=sk-omh-agent-test
          omh-agent-tests:ci
          omh-agent-tests-env omh-agent-tests-verify-env

      - name: Check plugin fixtures
        run: |
          node --experimental-strip-types ci/agent-tests/pi-omp-plugin-status-test.mjs apps/omh/src/integration/assets/pi/omh-agent-state.ts pi
          node --experimental-strip-types ci/agent-tests/pi-omp-plugin-status-test.mjs apps/omh/src/integration/assets/omp/omh-agent-state.ts omp
          node ci/agent-tests/qoder-openrouter-proxy-test.mjs
