name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  monorepo:
    name: monorepo tooling
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Enable pnpm
        run: corepack enable

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Turbo task graph
        run: pnpm turbo run quality --dry=json
      - name: Check Tegami release scope
        run: pnpm turbo run release-scope:check --filter=omh-rust

      - name: Check static website
        run: pnpm turbo run check --filter=@omh/website

  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Enable pnpm
        run: corepack enable

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install Rust tools
        uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60 # v2.85.7
        with:
          tool: cargo-nextest

      - name: Select Xcode for Zig
        if: runner.os == 'macOS'
        run: |
          # Zig 0.15.2 cannot link against Xcode 26.4+ macOS SDK TBDs
          # because their libSystem entries are arm64e-only.
          echo "DEVELOPER_DIR=/Applications/Xcode_26.3.app/Contents/Developer" >> "$GITHUB_ENV"

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2

      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: brew install cmake ninja

      - name: Restore cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false

      - name: Check formatting
        run: pnpm turbo run format:check --filter=omh

      - name: Lint
        if: runner.os != 'Windows'
        run: pnpm turbo run lint --filter=omh

      - name: Run structural Rust guardrails
        if: runner.os != 'Windows'
        run: pnpm turbo run ast:check --filter=omh-rust

      - name: Check Windows build
        if: runner.os == 'Windows'
        run: pnpm turbo run check --filter=omh

      - name: Run Windows smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pnpm turbo run build --filter=omh
          .\scripts\smoke_windows_conpty_path.ps1 -ExePath (Join-Path $PWD "target\debug\omh.exe") -Session "ci-windows-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"

      - name: Run Rust tests
        if: runner.os != 'Windows'
        run: pnpm turbo run ci:test --filter=omh

      - name: Run maintenance tests
        if: runner.os == 'Linux'
        run: pnpm turbo run maintenance:test --filter=omh-rust