name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  monorepo:
    name: monorepo tooling
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable pnpm
        run: corepack enable

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Turbo task graph
        run: pnpm turbo run check --dry=json

      - name: Check Tegami release scope
        run: node scripts/check-tegami-release-scope.mts omh
      - name: Run Tegami release-scope tests
        run: python3 -m unittest scripts.test_check_tegami_release_scope

  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install Rust tools
        uses: taiki-e/install-action@65851e10cd6c377f11a60e600abc07cb08643468 # v2
        with:
          tool: just,cargo-nextest

      - name: Select Xcode for Zig
        if: runner.os == 'macOS'
        run: |
          # Zig 0.15.2 cannot link against Xcode 26.4+ macOS SDK TBDs
          # because their libSystem entries are arm64e-only.
          echo "DEVELOPER_DIR=/Applications/Xcode_26.3.app/Contents/Developer" >> "$GITHUB_ENV"

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2

      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: brew install cmake ninja

      - name: Restore cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        if: runner.os != 'Windows'
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Check Windows build
        if: runner.os == 'Windows'
        run: cargo check --all-targets --locked

      - name: Run Windows smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --locked --bin omh
          .\scripts\smoke_windows_conpty_path.ps1 -ExePath (Join-Path $PWD "target\debug\omh.exe") -Session "ci-windows-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"

      - name: Run Rust tests
        if: runner.os != 'Windows'
        run: just ci-test

      - name: Run maintenance tests
        if: runner.os == 'Linux'
        run: python3 -m unittest scripts.test_agent_detection_manifest_check scripts.test_vendor_libghostty_vt scripts.test_testing_guidelines scripts.test_extract_release_notes