name: Agent Smoke Image

on:
  workflow_dispatch:
    inputs:
      run_opencode:
        description: Run the real OpenCode smoke against OpenRouter.
        type: boolean
        default: false
      model:
        description: Optional OpenRouter model slug for real smoke runs.
        type: string
        default: poolside/laguna-m.1:free

permissions:
  contents: read

concurrency:
  group: agent-smoke-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: build and verify image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build image
        run: docker build -t hako-agent-smoke:ci ci/agent-smoke

      - name: Check installed CLIs
        run: docker run --rm hako-agent-smoke:ci

      - name: Check provider env wiring
        run: >-
          docker run --rm
          -e OPENROUTER_API_KEY=sk-hako-smoke-test
          hako-agent-smoke:ci
          hako-agent-smoke-env hako-agent-smoke-verify-env

      - name: Run OpenCode smoke
        if: ${{ inputs.run_opencode }}
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          HAKO_SMOKE_MODEL: ${{ inputs.model }}
        run: >-
          docker run --rm
          -e OPENROUTER_API_KEY
          -e HAKO_SMOKE_MODEL
          hako-agent-smoke:ci
          hako-agent-smoke-env hako-agent-smoke-opencode
