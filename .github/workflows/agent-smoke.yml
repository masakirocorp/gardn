name: Agent Smoke

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/agent-smoke.yml
      - ci/agent-smoke/**
      - src/integration/assets/**
      - src/integration/mod.rs
      - justfile
  workflow_dispatch:
    inputs:
      run_real_smokes:
        description: Run real agent status smokes against OpenRouter.
        type: boolean
        default: true
      model:
        description: Optional OpenRouter model slug for real smoke runs.
        type: string
        default: poolside/laguna-m.1:free
      fallback_models:
        description: Optional comma-separated fallback OpenRouter model slugs.
        type: string
        default: openrouter/free,openai/gpt-oss-120b:free,nvidia/nemotron-3-super-120b-a12b:free,openrouter/owl-alpha
      opencode_model:
        description: Optional OpenCode model id for OpenCode smoke runs.
        type: string
        default: openrouter/openrouter/free
  schedule:
    - cron: "17 9 * * *"

permissions:
  contents: read
  packages: write

concurrency:
  group: agent-smoke-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/hako-agent-smoke
  HAKO_SMOKE_MODEL: ${{ inputs.model || 'poolside/laguna-m.1:free' }}
  HAKO_SMOKE_FALLBACK_MODELS: ${{ inputs.fallback_models || 'openrouter/free,openai/gpt-oss-120b:free,nvidia/nemotron-3-super-120b-a12b:free,openrouter/owl-alpha' }}
  HAKO_OPENCODE_SMOKE_MODEL: ${{ inputs.opencode_model || 'openrouter/openrouter/free' }}

jobs:
  image:
    name: build, publish, and smoke
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build image
        run: docker build -t hako-agent-smoke:ci -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" ci/agent-smoke

      - name: Check installed CLIs
        run: docker run --rm hako-agent-smoke:ci

      - name: Check provider env wiring
        run: >-
          docker run --rm
          -e OPENROUTER_API_KEY=sk-hako-smoke-test
          hako-agent-smoke:ci
          hako-agent-smoke-env hako-agent-smoke-verify-env

      - name: Log in to GHCR
        if: ${{ github.event_name != 'pull_request' }}
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Publish image
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

      - name: Run OpenCode status smoke
        if: ${{ github.event_name == 'schedule' || inputs.run_real_smokes }}
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: >-
          docker run --rm
          -e OPENROUTER_API_KEY
          -e HAKO_SMOKE_MODEL
          -e HAKO_SMOKE_FALLBACK_MODELS
          -e HAKO_OPENCODE_SMOKE_MODEL
          -v "${{ github.workspace }}:/repo:ro"
          hako-agent-smoke:ci
          hako-agent-smoke-env hako-agent-smoke-opencode-status


      - name: Run Pi and OMP status smoke
        if: ${{ github.event_name == 'schedule' || inputs.run_real_smokes }}
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: >-
          docker run --rm
          -e OPENROUTER_API_KEY
          -e HAKO_SMOKE_MODEL
          -e HAKO_SMOKE_FALLBACK_MODELS
          -v "${{ github.workspace }}:/repo:ro"
          hako-agent-smoke:ci
          hako-agent-smoke-env hako-agent-smoke-pi-omp-status

      - name: Cool down provider quota
        if: ${{ github.event_name == 'schedule' || inputs.run_real_smokes }}
        run: sleep 20

      - name: Run Claude status smoke
        if: ${{ github.event_name == 'schedule' || inputs.run_real_smokes }}
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: >-
          docker run --rm
          -e OPENROUTER_API_KEY
          -e HAKO_SMOKE_MODEL
          -e HAKO_SMOKE_FALLBACK_MODELS
          -v "${{ github.workspace }}:/repo:ro"
          hako-agent-smoke:ci
          hako-agent-smoke-env hako-agent-smoke-claude-status

      - name: Cool down provider quota
        if: ${{ github.event_name == 'schedule' || inputs.run_real_smokes }}
        run: sleep 20

      - name: Run Codex status smoke
        if: ${{ github.event_name == 'schedule' || inputs.run_real_smokes }}
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: >-
          docker run --rm
          -e OPENROUTER_API_KEY
          -e HAKO_SMOKE_MODEL
          -e HAKO_SMOKE_FALLBACK_MODELS
          -v "${{ github.workspace }}:/repo:ro"
          hako-agent-smoke:ci
          hako-agent-smoke-env hako-agent-smoke-codex-status

      - name: Cool down provider quota
        if: ${{ github.event_name == 'schedule' || inputs.run_real_smokes }}
        run: sleep 20

      - name: Run remaining agent status smoke
        if: ${{ github.event_name == 'schedule' || inputs.run_real_smokes }}
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: >-
          docker run --rm
          -e OPENROUTER_API_KEY
          -e HAKO_SMOKE_MODEL
          -e HAKO_SMOKE_FALLBACK_MODELS
          -v "${{ github.workspace }}:/repo:ro"
          hako-agent-smoke:ci
          hako-agent-smoke-env hako-agent-smoke-remaining-status

      - name: Cool down provider quota
        if: ${{ github.event_name == 'schedule' || inputs.run_real_smokes }}
        run: sleep 20

      - name: Run Cursor proxy status smoke
        if: ${{ github.event_name == 'schedule' || inputs.run_real_smokes }}
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: >-
          docker run --rm --user root
          -e OPENROUTER_API_KEY
          -e HAKO_SMOKE_MODEL
          -e HAKO_SMOKE_FALLBACK_MODELS
          -v "${{ github.workspace }}:/repo:ro"
          --add-host api2.cursor.sh:127.0.0.1
          --add-host api2geo.cursor.sh:127.0.0.1
          --add-host api2direct.cursor.sh:127.0.0.1
          --add-host agentn.api5.cursor.sh:127.0.0.1
          --add-host agent.api5.cursor.sh:127.0.0.1
          hako-agent-smoke:ci
          hako-agent-smoke-env hako-agent-smoke-cursor-proxy-status

      - name: Cool down provider quota
        if: ${{ github.event_name == 'schedule' || inputs.run_real_smokes }}
        run: sleep 20

      - name: Run Qoder proxy status smoke
        if: ${{ github.event_name == 'schedule' || inputs.run_real_smokes }}
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          QODER_PERSONAL_ACCESS_TOKEN: ${{ secrets.QODER_PERSONAL_ACCESS_TOKEN }}
        run: >-
          docker run --rm --user root
          -e OPENROUTER_API_KEY
          -e QODER_PERSONAL_ACCESS_TOKEN
          -e HAKO_SMOKE_MODEL
          -e HAKO_SMOKE_FALLBACK_MODELS
          -v "${{ github.workspace }}:/repo:ro"
          --add-host api1.qoder.sh:127.0.0.1
          --add-host api2.qoder.sh:127.0.0.1
          hako-agent-smoke:ci
          hako-agent-smoke-env hako-agent-smoke-qoder-proxy-status
