name: Agent Smoke Image

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-smoke-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: build and verify image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build image
        run: docker build -t hako-agent-smoke:ci ci/agent-smoke

      - name: Check installed CLIs
        run: docker run --rm hako-agent-smoke:ci

      - name: Check provider env wiring
        run: >-
          docker run --rm
          -e OPENROUTER_API_KEY=sk-hako-smoke-test
          hako-agent-smoke:ci
          hako-agent-smoke-env hako-agent-smoke-verify-env
