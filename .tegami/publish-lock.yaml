core:changelogs:
  - content: "---\npackages:\n  gardn:\n    type: patch\n---\n\n### Notify from the macOS extra when an agent needs you\n\nThe menu extra posts a Notification Center alert when an agent finishes, blocks, or joins Follow Up. Alerts fire when that state changes, not when you later open the extra.\n\n### Bring the host terminal forward from the extra\n\nClicking an extra row or a notification focuses that pane and activates the terminal that is running Gardn.\n\n### Keep control when focusing from the extra\n\nFocusing an agent from the extra no longer flashes Take Control.\n"
    filename: macos-extra-notify-and-focus.md
    v: 0.0.0
