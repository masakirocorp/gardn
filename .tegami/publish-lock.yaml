core:changelogs:
  - content: "---\npackages:\n  gardn:\n    type: patch\n---\n\n### Show SSH test results on a live connection\n\nTesting a saved SSH connection now reports success or failure immediately, including when the host is already connected.\n\n### Save an SSH group default without typing a directory\n\nClicking the host field in a new group dialog cycles Local and saved SSH connections. Saving an SSH host with an empty directory keeps that host and uses the connection's suggested directory.\n"
    filename: ssh-test-and-group-host.md
    v: 0.0.0
