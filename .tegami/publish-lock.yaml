  - content: "---\npackages:\n  gardn:\n    type: patch\n---\n\n### Match the macOS extra to the Agents sidebar\n\nThe menu extra lists agents in the same Triage, Follow Up, Working, and Idle groups as the app. The menu bar leaf fills when Follow Up or Triage needs attention.\n"
