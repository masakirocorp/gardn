  - content: "---\npackages:\n  gardn:\n    type: patch\n---\n\n### Ship a signed macOS extra\n\nmacOS releases now include a signed, notarized `Gardn.app` disk image. The extra can check for updates itself. PATH `gardn` stays the GitHub CLI release.\n"
    filename: macos-signed-app.md
    v: 0.0.0
