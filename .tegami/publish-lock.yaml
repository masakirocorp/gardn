core:changelogs:
  - content: "---\npackages:\n  gardn:\n    type: patch\n---\n\n### Ship the extra with a matching gardn binary\n\nThe macOS extra now includes the gardn CLI for its own use. It does not replace the GitHub-release `gardn` on PATH.\n"
