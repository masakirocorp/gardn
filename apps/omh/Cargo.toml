[package]
name = "omh"
version = "0.3.2"
edition = "2021"
build = "build.rs"
description = "terminal workspace manager for AI coding agents"
license = "AGPL-3.0-or-later"
publish = false
repository = "https://github.com/masakirocorp/oh-my-herdr"
homepage = "https://github.com/masakirocorp/oh-my-herdr"
keywords = ["terminal", "tui", "ai", "agents", "multiplexer"]
categories = ["command-line-utilities"]
include = ["src/**/*", "assets/**/*", "build.rs", "Cargo.toml"]

[dependencies]
base64 = "0.23"
# bincode 3.0.0 is an unmaintained tombstone (compile_error only); keep 2.x for wire contracts.
bincode = { version = "2.0.1", features = ["serde"] }
bytes = "1.12"
crossterm = "0.29"
ctrlc = "3.5"
interprocess = "2.4.3"
libc = "0.2"
omh-local-api = { path = "../../crates/omh-local-api" }
portable-pty = "=0.9.0"
png = "0.18"
ratatui = { version = "0.30.2", default-features = false, features = [
    "crossterm",
    "layout-cache",
    "underline-color",
    "unstable-rendered-line-info",
] }
regex = "1.13"
serde = { version = "1.0.229", features = ["derive"] }
serde_ignored = "0.1.14"
schemars = "1.2.2"
serde_json = "1.0.151"
sha2 = "0.11"
shell-words = "1.1"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "time"] }
toml = "1.1.4"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
unicode-width = "0.2"

[build-dependencies]
sha2 = "0.11"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Wdk_System_Threading",
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_System_Kernel",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
